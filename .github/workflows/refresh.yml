name: Refresh data and redeploy
# Pulls new blocks from the public Base RPC (incremental via cached cursors), re-runs the analysis,
# commits out/, and deploys the site. Runs every 20 minutes; can be triggered by hand.
on:
  schedule:
    - cron: '7,27,47 * * * *'   # every 20 minutes; runs are incremental (cached cursors), ~6-8 min each
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore chain data cache (raw logs + cursors)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: grail-data-${{ github.run_id }}
          restore-keys: grail-data-
      - run: ./refresh_config.sh
      - name: Run pipeline (retry once on transient RPC trouble)
        id: pipeline
        run: |
          PY=python ./run.sh 2>&1 | tee run.log && exit 0
          echo "::warning::pipeline failed, retrying in 2 minutes"; sleep 120
          PY=python ./run.sh 2>&1 | tee run.log
      - name: Save chain data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: grail-data-${{ github.run_id }}
      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out config
          git diff --cached --quiet || git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Open or update the failure issue after 3 consecutive failures
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          recent=$(gh run list --workflow=refresh.yml --limit 3 --json conclusion -q '[.[] | select(.conclusion=="failure")] | length')
          if [ "$recent" -lt 2 ]; then echo "fewer than 3 consecutive failures, not opening an issue"; exit 0; fi
          { printf 'The data refresh has failed on 3 or more consecutive runs. Latest run: %s\n\nLast lines of the pipeline log:\n\n```\n' "$RUN_URL"; grep -vE '^[[:space:]]*$' run.log | tail -25; printf '```\n\nThis issue is updated on every further failure and closed automatically by the next successful run.\n'; } > issue_body.md
          num=$(gh issue list --label refresh-failed --state open --json number -q '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body-file issue_body.md; else gh label create refresh-failed --color B60205 --description "Automated data refresh is failing" 2>/dev/null || true; gh issue create --title "Data refresh is failing" --label refresh-failed --body-file issue_body.md; fi
      - name: Close the failure issue after a successful run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label refresh-failed --state open --json number -q '.[].number'); do gh issue close "$n" --comment "Refresh succeeded again: $RUN_URL"; done
