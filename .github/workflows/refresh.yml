name: Refresh data and redeploy
# Pulls new blocks from the public Base RPC (incremental via cached cursors), re-runs the analysis,
# commits out/, and deploys the site. Runs daily; can be triggered by hand.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore chain data cache (raw logs + cursors)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: grail-data-${{ github.run_id }}
          restore-keys: grail-data-
      - run: ./refresh_config.sh
      - run: PY=python ./run.sh
      - name: Save chain data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: grail-data-${{ github.run_id }}
      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out config
          git diff --cached --quiet || git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
